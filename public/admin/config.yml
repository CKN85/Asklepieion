# ============================================================
# BACKEND — REPLACE THIS WHOLE BLOCK
# ------------------------------------------------------------
# After you register at decapbridge.com and add this site,
# DecapBridge will generate a "backend:" block for you that
# looks like the example below, but with YOUR real values.
# Copy theirs over this one exactly.
# ============================================================
backend:
  name: git-gateway
  repo: YOUR-GITHUB-USERNAME/asklepieion
  branch: main
  identity_url: https://auth.decapbridge.com/sites/YOUR-SITE-ID
  gateway_url: https://gateway.decapbridge.com

media_folder: "content/uploads"
public_folder: "/content/uploads"

collections:
  - name: "tablets"
    label: "Tablets"
    label_singular: "Tablet"
    folder: "content/tablets"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    summary: "{{title}} — {{hall}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "Hall"
        name: "hall"
        widget: "select"
        options:
          - { label: "Hall of Trikka — Anatomy", value: "trikka" }
          - { label: "Hall of Epidaurus — Physiology", value: "epidaurus" }
          - { label: "Hall of Kos — Biochemistry", value: "kos" }
          - { label: "Hall of Pergamon — Histopathology", value: "pergamon" }
          - { label: "The Propylon — Ethics", value: "ethics" }
      - { label: "Summary", name: "summary", widget: "text", required: false, hint: "One line, shown under the title in the hall's list" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", picker_utc: true }
      - { label: "Body", name: "body", widget: "markdown" }
